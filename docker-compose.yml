#
# docker-compose.yml for Hermes Agent
#
# Runs the Hermes gateway and web dashboard in ONE container using the stock image.
# The dashboard is supervised alongside the gateway in the same PID namespace via s6-rc
# when HERMES_DASHBOARD=1 is enabled.
#
# NOTE: Running the dashboard in a separate container is NOT supported because the
# dashboard's gateway-liveness check requires a shared PID namespace with the gateway.
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d --remove-orphans
#
# Rollback:
#   To revert to the previous two-container setup:
#   cp docker-compose.yml.bak-20261016 docker-compose.yml && docker compose up -d --remove-orphans
#
# File ownership:
#   Set HERMES_UID / HERMES_GID to the host user that owns ./data so
#   files created inside the container stay readable/writable on the host.
#   The entrypoint remaps the internal `hermes` user to these values via
#   usermod/groupmod + gosu.
#
# Security & Authentication:
#   - HERMES_DASHBOARD=1 activates the dashboard service in the container.
#   - Dashboard basic auth is configured via container environment variables:
#     HERMES_DASHBOARD_BASIC_AUTH_USERNAME and HERMES_DASHBOARD_BASIC_AUTH_PASSWORD.
#     The auth gate engages automatically on non-loopback binds and fails closed without credentials.
#   - The gateway's API server is loopback-bound unless API_SERVER_HOST=0.0.0.0 and
#     API_SERVER_KEY are set, and port 8642:8642 is published.
#
services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "9119:9119"
    volumes:
      - ./data:/opt/data
    environment:
      - TMPDIR=/tmp
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-admin}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines and publish port "8642:8642" under ports (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ./data/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]
